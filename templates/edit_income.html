{% extends "base.html" %}
{% block title %}Edit Income{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Edit Income</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Income Title</label>
        <input type="text" name="title"
               value="{{ values.title }}" maxlength="100" required>

        <label>Category</label>
        <select name="category" required>
            {% for cat in categories %}
            <option value="{{ cat }}"
                {% if values.category == cat %}selected{% endif %}>
                {{ cat }}
            </option>
            {% endfor %}
        </select>

        <label>Amount</label>
        <input type="number" name="amount"
               value="{{ values.amount }}" min="0.01"
               max="1000000000" step="0.01" required>

        <label>Date</label>
        <input type="date" name="date"
               value="{{ values.date }}"
               max="{{ current_year }}-12-31" required>

        <label>Description</label>
        <textarea name="description" maxlength="500">{{ values.description }}</textarea>

        <button class="btn" type="submit">Update Income</button>
        <a href="{{ url_for('transactions') }}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
