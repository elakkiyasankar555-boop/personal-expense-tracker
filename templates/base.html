
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Personal Expense Tracker{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="brand">
        <span class="brand-mark">₹</span>
        <h2>Expense Tracker</h2>
    </div>

    {% if session.get('user_id') %}

    <nav>
        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
           href="{{ url_for('dashboard') }}">Dashboard</a>

        <a class="nav-link {% if request.endpoint == 'transactions' %}active{% endif %}"
           href="{{ url_for('transactions') }}">Transactions</a>

        <a class="nav-link {% if request.endpoint == 'reports' %}active{% endif %}"
           href="{{ url_for('reports') }}">Reports</a>

        <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </nav>

    {% endif %}

</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>

</body>
</html>
